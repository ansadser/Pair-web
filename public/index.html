<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ROMA MD — Pairing</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="ambient ambient-one"></div><div class="ambient ambient-two"></div><div class="grid"></div>
<main class="container">
<section class="card">
  <div class="brand-row"><div class="logo">R</div><div><div class="brand">ROMA MD</div><div class="mini">SESSION GENERATOR</div></div></div>
  <h1>Link Your Device</h1>
  <p class="subtitle">Secure WhatsApp pairing for ROMA MD</p>
  <div class="tabs"><button id="pairTab" class="tab active">Pair Code</button><button id="qrTab" class="tab">QR Code</button></div>
  <section id="pairSection"><label>Country Code</label><input id="countryCode" inputmode="numeric" value="+91"><label>Phone Number</label><input id="phoneNumber" type="tel" inputmode="numeric" placeholder="9876543210"><button id="pairButton" class="primary">Generate Pair Code <span>→</span></button></section>
  <section id="qrSection" class="hidden"><button id="qrButton" class="primary">Generate QR <span>→</span></button><div id="qrContainer" class="qr-container hidden"><img id="qrImage" alt="WhatsApp QR"><p>WhatsApp → Linked Devices → Link a device</p></div></section>
  <section id="codeContainer" class="result hidden"><span>PAIRING CODE</span><strong id="pairCode">--------</strong><button id="copyCode" class="secondary">Copy Code</button></section>
  <div class="status"><span id="statusDot" class="status-dot"></span><span id="statusText">Waiting for a request...</span></div>
  <section id="sessionContainer" class="session hidden"><h3>Device Connected</h3><p>Your Session ID</p><div class="session-box"><code id="sessionId"></code><button id="copySession" class="secondary">Copy</button></div><div class="warning">Keep this Session ID private.</div></section>
  <footer><span></span> ROMA MD • SECURE PAIRING <span></span></footer>
</section>
</main>
<script src="/app.js"></script>
</body>
</html>
